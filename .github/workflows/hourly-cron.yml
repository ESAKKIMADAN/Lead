name: Hourly Push Notifications

on:
  schedule:
    - cron: '0 * * * *' # Runs exactly on the hour, every hour
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Cron Endpoint
        run: curl -X GET "${{ secrets.PRODUCTION_URL }}/api/cron/hourly"
